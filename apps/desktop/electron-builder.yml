appId: com.awaken.desktop
productName: Awaken
electronUpdaterCompatibility: ">=2.16"
extraMetadata:
  # Local and ad-hoc packages remain update-disabled. dist:release is the
  # only script allowed to override this marker to "stable".
  awakenUpdateChannel: disabled
# electron-builder resolves hook paths starting with "." against process.cwd();
# all dist scripts run electron-builder with cwd = apps/desktop, and the npm
# workspace root (repo root) check in app-builder-lib util/resolve.js then
# accepts ../../scripts/release/*.mjs as inside the workspace.
afterSign: ../../scripts/release/staple-macos-app.mjs
afterAllArtifactBuild: ../../scripts/release/notarize-macos-artifacts.mjs
publish:
  provider: github
  owner: NolanGrant556
  repo: Awaken-Releases
  releaseType: release
directories:
  output: dist-electron
  buildResources: build
files:
  - dist/**/*
  - package.json
  - "!dist/**/*.test.js"
  - "!dist/**/*.spec.js"
  - "!dist/**/*.map"
  - "!dist/**/__tests__/**"
  - "!dist/**/fixtures/**"
  # Production dependencies are copied with only the negative patterns above.
  # One-level node_modules ignores do not reach scoped packages or nested tests.
  - "!**/*.map"
  - "!**/*.{test,spec}.*"
  - "!**/__tests__{,/**}"
  - "!**/{playwright-tests,tests-examples}{,/**}"
  - "!**/node_modules/*/{CHANGELOG.md,README.md,readme.md,readme}"
  - "!**/node_modules/*/{test,__tests__,tests,powered-test,example,examples}"
  - "!**/.{idea,git,cache,vscode,DS_Store}"
extraResources:
  - from: resources/system-skills
    to: system-skills
    filter: ["**/*"]
  - from: resources/builtin-plugins
    to: builtin-plugins
    filter: ["**/*"]
  - from: resources/pets
    to: pets
    filter: ["**/*"]
  - from: resources/cli-connectors
    to: cli-connectors
    filter: ["**/*"]
  - from: resources/officecli-release.json
    to: officecli-release.json
  - from: resources/licenses
    to: licenses
    filter: ["**/*"]
  - from: resources/bin/${platform}-${arch}
    to: bin/${platform}-${arch}
    filter:
      - "**/*"
      - "!node/include/**/*"
      - "!node/share/doc/**/*"
      - "!node/share/man/**/*"
      - "!node/node_modules/npm/docs/**/*"
      - "!node/node_modules/npm/man/**/*"
      - "!node/README.md"
      - "!node/CHANGELOG.md"
      - "!**/*.map"
  - from: resources/cua-driver
    to: cua-driver
    filter:
      - "**/*"
      - "!**/*.map"
      - "!**/{test,tests,__tests__,example,examples}/**/*"
      - "!**/{README,CHANGELOG,readme,changelog}*"
  # electron-builder hardcodes a filter that drops the root-level `node_modules`
  # of any extraResources `from` directory (see app-builder-lib fileMatcher/filter.js,
  # `if (relative === "node_modules") return false`). We work around it by pointing
  # a second extraResources entry directly at that node_modules folder, so the CUA
  # host sidecar (host.mjs -> @trycua/cua-driver) has its deps in the installer.
  - from: resources/cua-driver/node_modules
    to: cua-driver/node_modules
    filter:
      - "**/*"
      - "!**/*.map"
      - "!**/{test,tests,__tests__,example,examples}/**/*"
      - "!**/{README,CHANGELOG,readme,changelog}*"
  - from: build/icon.png
    to: icon.png
mac:
  # Data assets are sealed by their enclosing bundle, not individually signed.
  # osx-sign's binary heuristic otherwise signs encoding tables and locale packs.
  signIgnore: '\.(json|pak|png|jpg|jpeg|gif|webp|ico|icns|woff|woff2|ttf|otf|pdf)$'
  icon: build/icon.icns
  category: public.app-category.developer-tools
  artifactName: "Awaken-${version}-${arch}.${ext}"
  # Release builds (dist:release) notarize via App Store Connect API key env
  # (APPLE_API_KEY / APPLE_API_KEY_ID / APPLE_API_ISSUER) and fail closed when
  # missing; local dist / dist:adhoc pass -c.mac.notarize=false explicitly.
  notarize: true
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64
win:
  icon: build/icon.ico
  artifactName: "Awaken-Setup-${version}-${arch}.${ext}"
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  perMachine: true
  allowToChangeInstallationDirectory: true
  allowElevation: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Awaken
linux:
  icon: build/icon.png
dmg:
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications
