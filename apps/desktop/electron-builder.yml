appId: com.awaken.desktop
productName: Awaken
directories:
  output: dist-electron
  buildResources: build
files:
  - dist/**/*
  - package.json
  - "!**/node_modules/*/{CHANGELOG.md,README.md,readme.md,readme}"
  - "!**/node_modules/*/{test,__tests__,tests,powered-test,example,examples}"
  - "!**/.{idea,git,cache,vscode,DS_Store}"
extraResources:
  - from: resources/system-skills
    to: system-skills
    filter: ["**/*"]
  - from: resources/pets
    to: pets
    filter: ["**/*"]
  - from: resources/cli-connectors
    to: cli-connectors
    filter: ["**/*"]
  - from: resources/bin/${platform}-${arch}
    to: bin/${platform}-${arch}
    filter: ["**/*"]
  - from: build/icon.png
    to: icon.png
mac:
  icon: build/icon.icns
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch:
        - arm64
        - x64
win:
  icon: build/icon.ico
nsis:
  oneClick: false
  perMachine: true
  allowToChangeInstallationDirectory: true
  allowElevation: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Awaken
linux:
  icon: build/icon.png
dmg:
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications
