<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Awaken Desktop</title>
    <script>
      try {
        const preference = localStorage.getItem("awaken:appearance:theme");
        const theme =
          preference === "dark" ||
          (preference === "system" &&
            window.matchMedia?.("(prefers-color-scheme: dark)").matches)
            ? "dark"
            : "light";
        document.documentElement.dataset.awTheme = theme;
        document.documentElement.dataset.awThemePreference =
          preference === "system" || preference === "dark" ? preference : "light";
        document.documentElement.style.colorScheme = theme;
      } catch {
        document.documentElement.dataset.awTheme = "light";
        document.documentElement.dataset.awThemePreference = "light";
        document.documentElement.style.colorScheme = "light";
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/renderer/main.tsx"></script>
  </body>
  </html>
