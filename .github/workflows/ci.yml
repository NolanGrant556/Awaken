# Continuous checks for main pushes and pull requests.
#
# unit: typecheck, Go/Desktop/script tests, docs and bundled plugins.
# acceptance: existing Electron functional regression on macOS and Windows.
# package-macos / package-windows: ad-hoc or unsigned client packages, content
# audit, and a host-native startup smoke.
# publish: on main, attach those installers to a prerelease in this repository.
# The tag is ci-<commit>. It is not a signed stable release.
#
# Signed publishing stays in desktop-release.yml. That workflow still refuses
# to publish until the installed-app upgrade smoke exists.

name: CI

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: "22"

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CGO_ENABLED: "0"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: npm ci

      - name: Install the Electron binary
        run: node node_modules/electron/install.js

      - name: Typecheck Design System and Desktop
        run: |
          set -euo pipefail
          npm run typecheck:ui
          npm run typecheck:desktop

      - name: Design system render smoke
        run: npm run smoke:ui

      - name: Desktop unit tests
        run: npm --workspace @awaken/desktop run test

      - name: Design System unit tests
        run: npm --workspace @awaken/design-system run test

      - name: Install a virtual display
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb xauth ripgrep
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Script and release-contract tests
        run: xvfb-run -a -s '-screen 0 1280x900x24' npm run test:scripts

      - name: Python skill and resource tests
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'lxml==6.1.3' 'openpyxl==3.1.5'
          npm run test:python

      - name: Bundled plugin integrity
        run: npm run check:builtin-plugins

      - name: Documentation structure and links
        run: |
          set -euo pipefail
          node scripts/check-docs.mjs
          npm run check:docs-links
          python3 -B .codex/skills/llm-provider-management/scripts/check_provider_docs.py

      - name: Install the CUA host dependencies
        run: node scripts/prepare-cua-driver.mjs

      - name: Go unit tests
        run: xvfb-run -a -s '-screen 0 1280x900x24' go test -count=1 ./...

  acceptance:
    name: Functional acceptance
    needs:
      - unit
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install the Electron binary
        run: node node_modules/electron/install.js

      - name: Exercise Mermaid in an isolated Electron window
        run: npm run test:mermaid-electron -- --artifacts smoke-evidence/mermaid

      - name: Upload functional acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-${{ matrix.os }}
          path: smoke-evidence/mermaid
          if-no-files-found: warn
          retention-days: 7

  package-macos:
    name: Package macOS
    needs:
      - unit
    runs-on: macos-latest
    timeout-minutes: 120
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      NODE_OPTIONS: "--max-old-space-size=5120"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install dependencies
        run: npm ci

      - name: Build ad-hoc macOS packages
        run: npm run dist:desktop:adhoc

      - name: Verify both ad-hoc app bundles
        run: |
          set -euo pipefail
          arm="apps/desktop/dist-electron/mac-arm64/Awaken.app"
          x64="apps/desktop/dist-electron/mac/Awaken.app"
          if [[ ! -d "$x64" ]]; then
            x64="apps/desktop/dist-electron/mac-x64/Awaken.app"
          fi
          test -d "$arm"
          test -d "$x64"
          codesign --verify --deep --strict "$arm"
          codesign --verify --deep --strict "$x64"

      - name: Audit package contents
        run: |
          node scripts/release/audit-package-contents.mjs \
            --dir apps/desktop/dist-electron \
            --receipt smoke-evidence/audit-receipt-macos.json

      - name: Smoke packaged desktop startup
        timeout-minutes: 10
        run: npm run smoke:packaged-desktop -- --dir apps/desktop/dist-electron --log smoke-evidence/packaged-desktop.log

      - name: Upload macOS package
        uses: actions/upload-artifact@v4
        with:
          name: macos-adhoc-package
          if-no-files-found: error
          retention-days: 7
          path: |
            apps/desktop/dist-electron/*.dmg
            apps/desktop/dist-electron/*.zip
            apps/desktop/dist-electron/*.blockmap
            apps/desktop/dist-electron/latest-mac.yml

      - name: Upload macOS package evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-package-evidence
          if-no-files-found: warn
          retention-days: 7
          path: smoke-evidence/

  package-windows:
    name: Package Windows
    needs:
      - unit
    runs-on: windows-latest
    timeout-minutes: 150
    env:
      CGO_ENABLED: "0"
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Put 7-Zip on PATH
        shell: pwsh
        run: |
          $sevenZip = Join-Path $env:ProgramFiles "7-Zip"
          if (-not (Test-Path (Join-Path $sevenZip "7z.exe"))) {
            throw "7z.exe is required to audit the NSIS package"
          }
          Add-Content -Path $env:GITHUB_PATH -Value $sevenZip

      - name: Install dependencies
        run: npm ci

      - name: Build unsigned Windows package
        run: npm run dist:desktop:adhoc

      - name: Audit package contents
        shell: bash
        run: |
          node scripts/release/audit-package-contents.mjs \
            --dir apps/desktop/dist-electron \
            --receipt smoke-evidence/audit-receipt-windows.json

      - name: Smoke packaged desktop startup
        timeout-minutes: 10
        run: npm run smoke:packaged-desktop -- --dir apps/desktop/dist-electron --log smoke-evidence/packaged-desktop.log

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: windows-unsigned-package
          if-no-files-found: error
          retention-days: 7
          path: |
            apps/desktop/dist-electron/*.exe
            apps/desktop/dist-electron/*.blockmap
            apps/desktop/dist-electron/latest.yml

      - name: Upload Windows package evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-package-evidence
          if-no-files-found: warn
          retention-days: 7
          path: smoke-evidence/

  publish:
    name: Publish installers
    needs:
      - package-macos
      - package-windows
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # gh release create resolves the repository through git. Downloaded
      # artifacts alone are not a checkout, so this step is required.
      - name: Checkout the published commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download macOS package
        uses: actions/download-artifact@v4
        with:
          name: macos-adhoc-package
          path: release-assets

      - name: Download Windows package
        uses: actions/download-artifact@v4
        with:
          name: windows-unsigned-package
          path: release-assets

      - name: Publish prerelease in this repository
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="ci-${GITHUB_SHA}"
          short="${GITHUB_SHA:0:7}"
          mkdir -p upload
          find release-assets -type f \
            \( -name '*.dmg' -o -name '*.exe' \) \
            -exec cp {} upload/ \;
          mapfile -d '' files < <(find upload -type f -print0 | sort -z)
          if [[ "${#files[@]}" -eq 0 ]]; then
            echo "no installer files to publish" >&2
            exit 1
          fi
          find upload -type f -printf '%f\n' | sort
          notes="$(mktemp)"
          cat > "$notes" <<EOF
          这是 commit ${GITHUB_SHA} 的 CI 安装包。

          macOS 包是 ad-hoc 签名，Windows 包未签名。它们只供下载安装，不是经过公证的稳定版，也不会写入 Awaken 的稳定更新通道。
          EOF
          # The heredoc above keeps the markdown readable; strip the indent.
          sed -i 's/^          //' "$notes"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${files[@]}" --clobber
          else
            gh release create "$tag" "${files[@]}" \
              --target "$GITHUB_SHA" \
              --prerelease \
              --latest=false \
              --title "Awaken CI ${short}" \
              --notes-file "$notes"
          fi

  ci-gate:
    name: CI gate
    runs-on: ubuntu-latest
    needs:
      - unit
      - acceptance
      - package-macos
      - package-windows
      - publish
    if: always()
    steps:
      - name: Require every CI job to succeed
        uses: actions/github-script@v7
        with:
          script: |
            const results = [
              ['Unit tests', '${{ needs.unit.result }}'],
              ['Functional acceptance', '${{ needs.acceptance.result }}'],
              ['Package macOS', '${{ needs['package-macos'].result }}'],
              ['Package Windows', '${{ needs['package-windows'].result }}'],
            ]
            const publishResult = '${{ needs.publish.result }}'
            const shouldPublish = '${{ github.ref }}' === 'refs/heads/main' &&
              ('${{ github.event_name }}' === 'push' || '${{ github.event_name }}' === 'workflow_dispatch')
            if (shouldPublish && publishResult !== 'success') {
              results.push(['Publish installers', publishResult])
            }
            if (!shouldPublish && publishResult !== 'skipped') {
              results.push(['Publish installers', publishResult])
            }
            const unsuccessful = results.filter(([, result]) => result !== 'success')
            if (unsuccessful.length > 0) {
              core.setFailed(
                `Required jobs did not succeed:\n${unsuccessful
                  .map(([name, result]) => `- ${name} (${result})`)
                  .join('\n')}`
              )
            }
